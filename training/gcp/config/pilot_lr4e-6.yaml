# Pilot: can the real 7B learn to make calls on a small set at this learning
# rate, before the full run is allowed to start? 32 conversations, 200 steps,
# then markers.py and a closed-loop evaluation on the same conversations.
extends: gcp_v3.yaml

run_dir: ${ELLE_WORK}/runs/pilot_lr4e-6

train:
  limit_episodes: 32
  max_steps: 200
  optim:
    lr: 4e-6

eval:
  every_steps: 50
  ckpt_every_steps: 100
  max_episodes: 32

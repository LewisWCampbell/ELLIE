# The real run, with every path under ELLE_WORK on the VM's data disk.
extends: ../../model/config/base_gpu.yaml

run_dir: ${ELLE_WORK}/runs/elle_tools_v1

data:
  # The retimed episodes the audio was assembled from. Never the raw ones:
  # their times would not match the audio.
  episodes: ${ELLE_WORK}/data/retimed.jsonl
  prepared_dir: ${ELLE_WORK}/runs/prepared_v1
  # Tool-free conversation mixed into every batch so plain talk doesn't decay.
  # Built by `prepare.sh mimi`; must exist before training starts.
  plain_prepared_dir: ${ELLE_WORK}/runs/plain_v1

eval:
  listen: 5                           # save 5 of Elle's generated replies as WAV for listening
  gen:                                # v1 has no compact calls, guard rules or error results
    constrain_calls: false
    error_results: false
    booking_guard: false

prepare:
  # v1 was trained on JSON calls, the old prompt and the zero prompt layout.
  # These pins keep its checkpoints and encodings readable (diagnose.sh).
  call_format: json
  prompt_audio: zero
  prompt_text: "<system> You work for Sam as his phone assistant and your name is Elle. You book intro calls. <system>"
  anchor_calls_to_utterance: false
  window_guard_frames: 0
  audio:
    audio_dir: ${ELLE_WORK}/audio
    audio_is_retimed: true              # assembled by `prepare.sh assemble` from retimed.jsonl

train:
  # PersonaPlex has no gradient checkpointing, so batch 8 risks running out of
  # the A100's 80 GB. 4 x 4 keeps the same effective batch (16) at about half
  # the activation memory.
  batch_size: 4
  grad_accum: 4
